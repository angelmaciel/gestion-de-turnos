# Blueprint de Render (https://render.com/docs/blueprint-spec): permite crear
# el servicio con "New +" → "Blueprint" en vez de configurar todo a mano.
# Las variables con `sync: false` hay que completarlas en el dashboard
# después de crear el servicio — son secretos o dependen de la URL que
# Render asigna, no pueden vivir en este archivo versionado.

# Cada pull request levanta su propio entorno con instancias nuevas de todo lo
# definido acá. Con `manual` el entorno se crea a pedido desde el dashboard.
#
# La base no se copia de producción, pero el preview NO arranca vacío: el
# entrypoint corre `migrate --force` y `db:seed --force` en cada arranque
# (el disco del free tier es efímero), así que trae los usuarios sembrados.
#
# Sin expiración los entornos quedan vivos indefinidamente y con `automatic`
# se acumulan solos. Tres días cubre la vida útil de una revisión.
previews:
  generation: automatic
  expireAfterDays: 3

services:
  - type: web
    name: gestion-turnos-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SANCTUM_STATEFUL_DOMAINS
        sync: false
      - key: SESSION_DOMAIN
        sync: false
      - key: BROADCAST_CONNECTION
        value: pusher
      - key: PUSHER_APP_ID
        sync: false
      - key: PUSHER_APP_KEY
        sync: false
      - key: PUSHER_APP_SECRET
        sync: false
      - key: PUSHER_APP_CLUSTER
        sync: false
