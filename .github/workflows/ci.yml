name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Pest · Pint · PHPStan)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestion-turnos-back
    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo_sqlite, sqlite3, zip
          ini-values: memory_limit=512M
          coverage: none

      - name: Cache de dependencias de Composer
        uses: actions/cache@v4
        with:
          path: gestion-turnos-back/vendor
          key: composer-${{ hashFiles('gestion-turnos-back/composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      # Los tests fuerzan su propia config (SQLite en memoria, sin Redis) vía
      # phpunit.xml; el .env solo hace falta para tener APP_KEY.
      - name: Preparar entorno de testing
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Pint (estilo de código)
        run: ./vendor/bin/pint --test

      - name: PHPStan (análisis estático)
        run: ./vendor/bin/phpstan analyse

      - name: Pest (tests)
        run: php artisan test

  frontend:
    name: Frontend (ESLint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestion-turnos-front
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gestion-turnos-front/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build

  api:
    name: API (Newman · JMeter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La misma imagen que se publica en Render: SQLite, sin Redis, se siembra
      # sola al arrancar con los usuarios de ejemplo.
      - name: Construir la imagen de la app
        run: docker build -t gestion-turnos-qa .

      - name: Levantar la app con los límites de producción
        run: |
          docker network create qa-net
          docker run -d --name turnos-qa --network qa-net -p 10000:10000 \
            -e BROADCAST_CONNECTION=log -e SESSION_SECURE_COOKIE=false gestion-turnos-qa
          timeout 90 sh -c 'until curl -sf http://localhost:10000/up > /dev/null; do sleep 2; done'

      - name: Pruebas de API (Postman con Newman)
        run: |
          npx -y -p newman@6.2.1 -p newman-reporter-htmlextra@1.23.1 newman run \
            qa/postman/gestion-turnos.postman_collection.json \
            -e qa/postman/local.postman_environment.json \
            --reporters cli,junit,htmlextra \
            --reporter-junit-export qa/resultados/newman.xml \
            --reporter-htmlextra-export qa/resultados/newman.html

      # Todos los usuarios virtuales salen de una misma IP: con los límites de
      # producción la prueba mediría el limitador, no la app (ver config/limites.php).
      - name: Reiniciar la app con límites altos para la carga
        run: |
          docker rm -f turnos-qa
          docker run -d --name turnos-qa --network qa-net -p 10000:10000 \
            -e BROADCAST_CONNECTION=log -e SESSION_SECURE_COOKIE=false \
            -e RATE_LIMIT_LOGIN=10000 -e RATE_LIMIT_LOGIN_IP=10000 \
            -e RATE_LIMIT_API=1000000 -e RATE_LIMIT_PUBLICO=1000000 gestion-turnos-qa
          timeout 90 sh -c 'until curl -sf http://localhost:10000/up > /dev/null; do sleep 2; done'

      - name: Prueba de carga (JMeter, 50 usuarios durante 60 s)
        run: |
          mkdir -p qa/resultados
          docker run --rm --network qa-net -v "$PWD/qa/jmeter:/plan:ro" -v "$PWD/qa/resultados:/out" \
            alpine/jmeter:5.6.3@sha256:0f08fe396259787ad5c8970548f16bd3698d1e96d87056565336fbc005f6c5f2 \
            -n -t /plan/jornada.jmx -Jhost=turnos-qa -Jusuarios=10 -Jrampa=10 -Jduracion=60 \
            -l /out/jmeter.jtl -e -o /out/jmeter

      - name: Umbrales de la carga (P95 ≤ 500 ms, errores ≤ 1 %)
        run: node qa/jmeter/verificar-umbrales.mjs qa/resultados/jmeter/statistics.json 500 1

      - name: Guardar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-api
          path: qa/resultados/
