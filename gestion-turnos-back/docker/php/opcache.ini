; Laravel + vendor/ supera los 10000 archivos que trae el default de PHP.
; Al pasarse del límite, OPcache deja de cachear y recompila en cada request:
; sobre el bind mount de Docker Desktop en Windows eso cuesta varios segundos.
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=30000

; Se siguen detectando cambios en el código (necesario en desarrollo),
; pero revisando timestamps cada 2s en vez de en cada request.
opcache.validate_timestamps=1
opcache.revalidate_freq=2

; Menos llamadas al sistema de archivos, que es lo caro en el bind mount.
opcache.save_comments=1
opcache.fast_shutdown=1
