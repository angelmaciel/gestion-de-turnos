server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 20m;

    # No revelar la versión de nginx en las respuestas ni en las páginas de error.
    server_tokens off;

    # Cabeceras de seguridad.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;          # Anti clickjacking.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # Datos de pacientes: que ningún proxy o navegador los guarde en caché.
    add_header Cache-Control "no-store" always;

    # Nunca servir archivos sensibles aunque queden en el directorio público.
    location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }
    location ~* \.(env|log|sql|sqlite|bak|ini|yml|yaml|lock|json)$ { deny all; }
    location ^~ /vendor/ { deny all; }
    location ^~ /storage/logs/ { deny all; }

    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # DNS interno de Docker. Resolver el upstream en runtime (vía variable)
    # evita el 502 cuando el contenedor `app` se recrea y cambia de IP:
    # con `fastcgi_pass app:9000` literal, nginx cachea la IP al arrancar.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ \.php$ {
        include fastcgi_params;
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_script_name;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }

    location ~ /\.ht {
        deny all;
    }
}
